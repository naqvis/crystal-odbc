name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shards
            lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc

          # Configure SQLite ODBC driver
          sudo tee /etc/odbcinst.ini > /dev/null <<EOF
          [SQLITE3]
          Description=SQLite ODBC Driver
          Driver=libsqlite3odbc.so
          Setup=libsqlite3odbc.so
          Threading=2
          EOF

          # Verify setup
          odbcinst -q -d

      - name: Install shards
        run: shards install

      - name: Check formatting
        run: crystal tool format --check

      - name: Run specs
        run: crystal spec --verbose
        env:
          # Set environment variables for better debugging
          ODBC_ENABLE_TRACING: "false"
          ODBC_CONNECTION_TIMEOUT: "30"

      - name: Run specs with tracing (on failure)
        if: failure()
        run: |
          echo "Running specs with ODBC tracing enabled for debugging..."
          crystal spec --verbose
        env:
          ODBC_ENABLE_TRACING: "true"
          ODBC_TRACE_FILE: "/tmp/odbc_trace.log"
          ODBC_CONNECTION_TIMEOUT: "30"

      - name: Upload trace logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: odbc-trace-logs
          path: /tmp/odbc_trace.log
          if-no-files-found: ignore
