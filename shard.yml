name: odbc
version: 1.0.0
description: |
  Crystal ODBC driver implementing crystal-db API. Provides cross-platform database connectivity 
  through unixODBC for SQLite, SQL Server, Oracle, and other ODBC-compatible databases with 
  robust type conversion and driver compatibility.

authors:
  - Ali Naqvi <syed.alinaqvi@gmail.com>

crystal: ">=1.0.0"

dependencies:
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.14.0

license: MIT
